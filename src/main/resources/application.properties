#tesseract.data.path=/usr/share/tesseract-ocr/4.00/tessdata

receipt.preprocessing.denoise.strength=25
receipt.preprocessing.contrast.limit=4
receipt.preprocessing.enable.denoise=true
receipt.preprocessing.enable.contrast=true
receipt.preprocessing.enable.binarization=false
receipt.preprocessing.enable.deskew=false
receipt.preprocessing.enable.enhance=true

# Tesseract configuration
tesseract.data.path=C:/Program Files/Tesseract-OCR/tessdata
tesseract.language=rus
tesseract.page.segmentation.mode=6
tesseract.ocr.engine.mode=3

receipt.recognition.confidence.threshold=60